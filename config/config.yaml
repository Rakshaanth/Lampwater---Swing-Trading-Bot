data:
  raw_dir: data/raw
  features_dir: data/features
  models_dir: data/models
  logs_dir: logs
  tickers_file: config/tickers.txt
  history_years: 5

labeling:
  horizon: 5          # trading days to look forward
  take_profit: 0.08   # +8% target
  stop_loss: 0.05     # -5% stop
  # trigger_mode: strict uses macd_cross==1; relaxed uses macd > macd_signal
  trigger_mode: strict
  min_candidates: 100
  min_positives: 30

model:
  max_depth: 5
  learning_rate: 0.05
  n_estimators: 400
  subsample: 0.8
  # scale_pos_weight: auto  # set to a number to override auto-computation

execution:
  confidence_threshold: 0.65
  max_open_positions: 10
  position_size_usd: 1000
  warmup_days: 100    # bars needed before features are reliable
